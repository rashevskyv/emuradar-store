name: store

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

# This workflow is the only writer of catalog.json, repo.json and skipped.json.
concurrency:
  group: store
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog.json from the SwitchPorts README
        run: python catalog.py

      - name: Build packages and upload them to release "store"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_store.py --repo "${{ github.repository }}"

      - name: Commit changed metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json repo.json skipped.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "store: update catalog and repo.json"
            git push
          fi
